                                                  "url": "https://chungpinglee.github.io/policyholder/STEP3%E7%90%86%E8%B3%A0%E7%B4%80%E9%8C%84-GITHUB/%E4%B8%BB%E7%95%AB%E9%9D%A2-%E7%90%86%E8%B3%A0%E7%B4%80%E9%8C%84.html",
                                                  "icon": "fa-link",
                                                  "color": "blue"
                                        },
                                        {
                                                  "id": "item_1784710907657",
                                                  "title": "客戶還本紀錄",
                                                  "url": "https://chungpinglee.github.io/policyholder/%E9%82%84%E6%9C%AC%E9%87%91-%E5%8A%A0%E5%AF%86%E6%AA%94/%E4%B8%BB%E7%95%AB%E9%9D%A2-%E9%82%84%E6%9C%AC%E7%B4%80%E9%8C%84.html",
                                                  "icon": "fa-link",
                                                  "color": "blue"
                                        }
                              ]
                    }
          ]
};
    </script>

    <script>
        // 跳脫 HTML 避免引號導致的版面錯誤
        function escapeHTML(str) {
            if (!str) return '';
            return str.replace(/[&<>'"]/g, 
                tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag)
            );
        }

        // ================= 密碼驗證邏輯 =================
        function promptAdminPassword() {
            const modal = document.getElementById('password-modal');
            const input = document.getElementById('password-input');
            input.value = '';
            modal.style.display = 'flex';
            setTimeout(() => input.focus(), 100);

            // 支援 Enter 鍵送出
            input.onkeyup = (e) => {
                if (e.key === 'Enter') checkPassword();
            };
        }

        function closePasswordModal() {
            document.getElementById('password-modal').style.display = 'none';
        }

        function checkPassword() {
            const input = document.getElementById('password-input');
            if (input.value === '362963') {
                closePasswordModal();
                openAdmin();
            } else {
                showToast('密碼錯誤，請重新輸入！');
                input.value = '';
                input.focus();
            }
        }

        // 自訂 Toast 提示
        function showToast(msg) {
            const toast = document.getElementById('toast-notification');
            const toastMsg = document.getElementById('toast-message');
            toastMsg.textContent = msg;
            toast.classList.remove('opacity-0', 'pointer-events-none', 'translate-y-[-10px]');
            toast.classList.add('opacity-100', 'translate-y-0');
            
            setTimeout(() => {
                toast.classList.remove('opacity-100', 'translate-y-0');
                toast.classList.add('opacity-0', 'pointer-events-none', 'translate-y-[-10px]');
            }, 3000);
        }

        // 自訂確認 Modal 替代 confirm()
        function showConfirm(msg, onConfirm) {
            const modal = document.getElementById('custom-confirm-modal');
            const msgElem = document.getElementById('custom-confirm-msg');
            const btnOk = document.getElementById('custom-confirm-ok');
            const btnCancel = document.getElementById('custom-confirm-cancel');

            msgElem.textContent = msg;
            modal.style.display = 'flex';

            const cleanUp = () => {
                modal.style.display = 'none';
                btnOk.onclick = null;
                btnCancel.onclick = null;
            };

            btnOk.onclick = () => {
                cleanUp();
                onConfirm();
            };
            btnCancel.onclick = cleanUp;
        }

        // ================= 前台渲染邏輯 =================
        function renderMain() {
            const container = document.getElementById('dynamic-content');
            container.innerHTML = '';
            
            siteData.categories.forEach(cat => {
                const section = document.createElement('section');
                section.className = 'mb-10';
                
                const gridId = `grid-${Math.random().toString(36).substr(2, 9)}`;
                section.innerHTML = `
                    <h2 class="text-xl font-bold text-slate-200 mb-4 px-2 flex items-center gap-2">
                        <span class="w-1.5 h-5 bg-green-500 rounded-full"></span> ${escapeHTML(cat.name)}
                    </h2>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4" id="${gridId}"></div>
                `;
                container.appendChild(section);
                
                const grid = document.getElementById(gridId);
                
                if (!cat.items || cat.items.length === 0) {
                    grid.innerHTML = `<div class="col-span-2 py-8 text-center text-slate-500 italic bg-white/5 rounded-2xl border border-dashed border-white/10">尚未加入項目</div>`;
                } else {
                    cat.items.forEach(item => {
                        const card = document.createElement('div');
                        card.className = 'menu-card p-5 rounded-2xl flex items-center shadow-sm';
                        card.onclick = () => openViewer(item.url);
                        
                        const colors = { 
                            blue: 'bg-blue-50 text-blue-600', 
                            green: 'bg-emerald-50 text-emerald-600', 
                            red: 'bg-rose-50 text-rose-600', 
                            purple: 'bg-purple-50 text-purple-600', 
                            yellow: 'bg-amber-50 text-amber-600', 
                            gray: 'bg-slate-100 text-slate-600' 
                        };
                        const c = colors[item.color] || colors.blue;
                        
                        card.innerHTML = `
                            <div class="icon-box w-12 h-12 ${c} rounded-xl flex items-center justify-center mr-4 text-xl flex-shrink-0 transition-colors duration-400">
                                <i class="fas ${escapeHTML(item.icon)}"></i>
                            </div>
                            <div class="relative flex-1">
                                <h3 class="font-bold text-base whitespace-normal break-words">${escapeHTML(item.title)}</h3>
                            </div>
                        `;
                        grid.appendChild(card);
                    });
                }
            });
        }

        // ================= 後台管理邏輯 =================
        function openAdmin() {
            document.getElementById('admin-panel').style.display = 'flex';
            document.body.style.overflow = 'hidden';
            renderAdminBody();
        }

        function closeAdmin() {
            document.getElementById('admin-panel').style.display = 'none';
            document.body.style.overflow = 'auto';
        }

        function renderAdminBody() {
            const body = document.getElementById('admin-body');
            let html = '';
            
            siteData.categories.forEach((cat, cIdx) => {
                html += `
                <div class="mb-8 p-5 border border-slate-200 rounded-xl bg-white shadow-sm relative">
                    <div class="flex justify-between items-center mb-4 pb-3 border-b border-slate-100">
                        <div class="flex items-center gap-2 w-2/3">
                            <i class="fas fa-folder-open text-slate-400"></i>
                            <input type="text" value="${escapeHTML(cat.name)}" onchange="updateCatName(${cIdx}, this.value)" class="font-bold text-lg text-slate-800 border-b-2 border-transparent hover:border-slate-300 focus:border-green-500 outline-none bg-transparent px-1 w-full" placeholder="請輸入分類名稱">
                        </div>
                        <button onclick="deleteCategory(${cIdx})" class="text-red-400 hover:text-red-600 font-bold text-sm px-2 py-1 rounded hover:bg-red-50 transition">
                            <i class="fas fa-trash"></i> 刪除分類
                        </button>
                    </div>
                    
                    <div class="space-y-3">
                        ${(!cat.items || cat.items.length === 0) ? '<p class="text-sm text-slate-400 italic py-2 text-center">目前無按鈕，請點擊下方新增</p>' : ''}
                        ${(cat.items || []).map((item, iIdx) => `
                            <div class="flex flex-wrap md:flex-nowrap gap-3 items-center p-3 bg-slate-50 hover:bg-slate-100 transition rounded-lg border border-slate-200">
                                <div class="flex-1 grid grid-cols-1 md:grid-cols-12 gap-2">
                                    <div class="md:col-span-3">
                                        <label class="text-xs text-slate-500 mb-1 block">按鈕名稱</label>
                                        <input type="text" value="${escapeHTML(item.title)}" onchange="updateItem(${cIdx}, ${iIdx}, 'title', this.value)" class="w-full border p-2 rounded focus:border-green-500 outline-none text-sm bg-white" placeholder="例: 車險輔助說明">
                                    </div>
                                    <div class="md:col-span-4">
                                        <label class="text-xs text-slate-500 mb-1 block">連結網址 (URL)</label>
                                        <input type="text" value="${escapeHTML(item.url)}" onchange="updateItem(${cIdx}, ${iIdx}, 'url', this.value)" class="w-full border p-2 rounded focus:border-green-500 outline-none text-sm bg-white" placeholder="http://... 或 .html">
                                    </div>
                                    <div class="md:col-span-2">
                                        <label class="text-xs text-slate-500 mb-1 block">圖示 (Icon)</label>
                                        <input type="text" value="${escapeHTML(item.icon)}" onchange="updateItem(${cIdx}, ${iIdx}, 'icon', this.value)" class="w-full border p-2 rounded focus:border-green-500 outline-none text-sm bg-white" placeholder="例: fa-car">
                                    </div>
                                    <div class="md:col-span-3">
                                        <label class="text-xs text-slate-500 mb-1 block">顏色</label>
                                        <select onchange="updateItem(${cIdx}, ${iIdx}, 'color', this.value)" class="w-full border p-2 rounded focus:border-green-500 outline-none text-sm bg-white">
                                            <option value="blue" ${item.color==='blue'?'selected':''}>藍色 (Blue)</option>
                                            <option value="green" ${item.color==='green'?'selected':''}>綠色 (Green)</option>
                                            <option value="red" ${item.color==='red'?'selected':''}>紅色 (Red)</option>
                                            <option value="purple" ${item.color==='purple'?'selected':''}>紫色 (Purple)</option>
                                            <option value="yellow" ${item.color==='yellow'?'selected':''}>黃色 (Yellow)</option>
                                            <option value="gray" ${item.color==='gray'?'selected':''}>灰色 (Gray)</option>
                                        </select>
                                    </div>
                                </div>
                                <div class="flex items-end h-full pb-1 pl-2 border-l border-slate-200">
                                    <button onclick="deleteItem(${cIdx}, ${iIdx})" class="text-slate-400 hover:text-red-500 text-lg p-2 transition" title="刪除此按鈕">
                                        <i class="fas fa-times-circle"></i>
                                    </button>
                                </div>
                            </div>
                        `).join('')}
                    </div>
                    
                    <div class="mt-4 pt-3 border-t border-slate-100">
                        <button onclick="addItem(${cIdx})" class="text-green-600 hover:text-white border border-green-600 hover:bg-green-600 font-bold text-sm px-4 py-2 rounded-lg transition">
                            <i class="fas fa-plus mr-1"></i> 新增按鈕
                        </button>
                    </div>
                </div>`;
            });
            
            html += `
            <div class="text-center mt-6 pb-6">
                <button onclick="addCategory()" class="bg-slate-800 text-white px-6 py-3 rounded-xl shadow-lg hover:bg-slate-700 transition font-bold flex items-center gap-2 mx-auto">
                    <i class="fas fa-folder-plus"></i> 新增一個大分類
                </button>
            </div>`;
            
            body.innerHTML = html;
        }

        // --- 資料更新操作 ---
        function updateCatName(cIdx, val) { siteData.categories[cIdx].name = val; }
        function updateItem(cIdx, iIdx, key, val) { siteData.categories[cIdx].items[iIdx][key] = val; }
        
        function addCategory() {
            siteData.categories.push({ name: "新分類", items: [] });
            renderAdminBody();
            setTimeout(() => {
                const body = document.getElementById('admin-body');
                body.scrollTop = body.scrollHeight;
            }, 50);
        }
        
        function deleteCategory(cIdx) {
            showConfirm('確定要刪除整個分類與底下的所有按鈕嗎？', () => {
                siteData.categories.splice(cIdx, 1);
                renderAdminBody();
                showToast('分類已刪除');
            });
        }

        function addItem(cIdx) {
            siteData.categories[cIdx].items.push({
                id: "item_" + Date.now(),
                title: "新按鈕",
                url: "",
                icon: "fa-link",
                color: "blue"
            });
            renderAdminBody();
        }

        function deleteItem(cIdx, iIdx) {
            showConfirm('確定要刪除這個按鈕嗎？', () => {
                siteData.categories[cIdx].items.splice(iIdx, 1);
                renderAdminBody();
                showToast('按鈕已刪除');
            });
        }

        function applyAdminChanges() { 
            renderMain(); 
            closeAdmin();
            showToast('變更已套用預覽'); 
        }

        // ================= 匯出 HTML (使用當前頁面檔名覆蓋) =================
        function exportHTML() {
            // 1. 將最新的 siteData 寫入 <script id="app-data">
            const scriptTag = document.getElementById('app-data');
            scriptTag.textContent = `\n        let siteData = ${JSON.stringify(siteData, null, 12)};\n    `;

            // 2. 複製整份文件
            const clone = document.documentElement.cloneNode(true);

            // 3. 清理複製出來的 UI 狀態
            const adminPanel = clone.querySelector('#admin-panel');
            if (adminPanel) adminPanel.style.display = 'none';

            const passModal = clone.querySelector('#password-modal');
            if (passModal) passModal.style.display = 'none';
            
            const body = clone.querySelector('body');
            if (body) body.style.overflow = 'auto';

            const dynamicContent = clone.querySelector('#dynamic-content');
            if (dynamicContent) dynamicContent.innerHTML = ''; 

            const viewer = clone.querySelector('#content-viewer-container');
            if (viewer) viewer.style.display = 'none';

            const confirmModal = clone.querySelector('#custom-confirm-modal');
            if (confirmModal) confirmModal.style.display = 'none';

            // 4. 自動偵測檔名，優先讀取當前檔案網址檔名或 document.title
            let currentFileName = '雲端銷售手冊.html';
            try {
                const pathFileName = decodeURIComponent(window.location.pathname.split('/').pop());
                if (pathFileName && pathFileName.trim() !== '' && pathFileName.endsWith('.html')) {
                    currentFileName = pathFileName;
                } else if (document.title && document.title.trim() !== '') {
                    currentFileName = document.title.trim() + '.html';
                }
            } catch (e) {
                currentFileName = (document.title || '雲端銷售手冊').trim() + '.html';
            }

            // 5. 組裝 HTML 字串
            const htmlContent = `<!DOCTYPE html>\n<html lang="zh-Hant">\n${clone.innerHTML}\n</html>`;

            // 6. 觸發下載，下載檔名即為當前檔名
            const blob = new Blob([htmlContent], { type: 'text/html;charset=utf-8' });
            const a = document.createElement('a');
            const url = URL.createObjectURL(blob);
            a.href = url;
            a.download = currentFileName; 
            document.body.appendChild(a);
            a.click();
            setTimeout(() => {
                document.body.removeChild(a);
                URL.revokeObjectURL(url);
            }, 0);
            
            showToast(`已儲存為 ${currentFileName}`);
        }

        // ================= 檔案檢視器與拖曳邏輯 =================
        function openViewer(url) {
            if (!url) {
                showToast("請先在後台設定連結網址！");
                return;
            }
            const container = document.getElementById('content-viewer-container');
            const spinner = document.getElementById('loading-spinner');
            const ifr = document.getElementById('content-iframe');
            
            container.style.display = 'block';
            spinner.style.display = 'block';
            document.body.style.overflow = 'hidden'; 
            
            ifr.src = url;
            ifr.onload = () => spinner.style.display = 'none';
        }

        function closeViewer() {
            document.getElementById('content-viewer-container').style.display = 'none';
            document.getElementById('content-iframe').src = ''; 
            document.body.style.overflow = 'auto';
        }

        let isDragging = false, startX, startY, initL, initT, hasMoved = false;
        const dragElem = document.getElementById('draggable-nav');

        dragElem.onmousedown = (e) => {
            isDragging = true;
            hasMoved = false;
            startX = e.clientX;
            startY = e.clientY;
            const r = dragElem.getBoundingClientRect();
            initL = r.left;
            initT = r.top;
        };

        window.onmousemove = (e) => {
            if (!isDragging) return;
            const dx = e.clientX - startX;
            const dy = e.clientY - startY;
            if (Math.abs(dx) > 5 || Math.abs(dy) > 5) hasMoved = true;
            dragElem.style.left = `${Math.max(10, Math.min(initL + dx, window.innerWidth - 80))}px`;
            dragElem.style.top = `${Math.max(10, Math.min(initT + dy, window.innerHeight - 80))}px`;
        };

        window.onmouseup = () => { isDragging = false; };

        // 觸控支援
        dragElem.ontouchstart = (e) => {
            isDragging = true;
            hasMoved = false;
            startX = e.touches[0].clientX;
            startY = e.touches[0].clientY;
            const r = dragElem.getBoundingClientRect();
            initL = r.left;
            initT = r.top;
        };
        window.ontouchmove = (e) => {
            if (!isDragging) return;
            const dx = e.touches[0].clientX - startX;
            const dy = e.touches[0].clientY - startY;
            if (Math.abs(dx) > 5 || Math.abs(dy) > 5) hasMoved = true;
            dragElem.style.left = `${Math.max(10, Math.min(initL + dx, window.innerWidth - 80))}px`;
            dragElem.style.top = `${Math.max(10, Math.min(initT + dy, window.innerHeight - 80))}px`;
        };
        window.ontouchend = () => { isDragging = false; };

        document.getElementById('home-btn').onclick = () => {
            if (!hasMoved) closeViewer();
        };

        // 頁面載入時渲染
        window.onload = renderMain;
    </script>



</body>
</html>
