        function AutoTextarea({ value, onChange, placeholder, className = "" }) {
            const textareaRef = useRef(null);

            useEffect(() => {
                if (textareaRef.current) {
                    textareaRef.current.style.height = 'auto';
                    textareaRef.current.style.height = `${textareaRef.current.scrollHeight}px`;
                }
            }, [value]);

            const handleKeyDown = (e) => {
                if (e.key === 'Enter') {
                    e.preventDefault();
                }
            };

            return (
                <textarea
                    ref={textareaRef}
                    rows={1}
                    value={value || ''}
                    onChange={onChange}
                    onKeyDown={handleKeyDown}
                    placeholder={placeholder}
                    className={`w-full bg-transparent resize-none overflow-hidden focus:outline-none transition-all ${className}`}
                />
            );
        }

        function App() {
            const [showBackend, setShowBackend] = useState(false);
            const [githubBaseUrl, setGithubBaseUrl] = useState(INITIAL_GITHUB_BASE);
            const [folders, setFolders] = useState(INITIAL_FOLDERS);
            const [searchTerm, setSearchTerm] = useState('');
            const [selectedFile, setSelectedFile] = useState(null);
            const [showTooltip, setShowTooltip] = useState(false);
            const [notification, setNotification] = useState({ show: false, message: '', type: 'success' });
            const [isInputHovered, setIsInputHovered] = useState(false);
            
            const [fontSize, setFontSize] = useState(() => localStorage.getItem('claim_font_size') || 'normal');
            
            const [failedAttempts, setFailedAttempts] = useState(() => Number(localStorage.getItem('claim_failed_attempts') || 0));
            const [lockoutUntil, setLockoutUntil] = useState(() => Number(localStorage.getItem('claim_lockout_until') || 0));
            const [showPasswordModal, setShowPasswordModal] = useState(false);
            const [showLockoutModal, setShowLockoutModal] = useState(false);
            const [passwordInput, setPasswordInput] = useState('');
            const [passwordError, setPasswordError] = useState('');

            const [columns, setColumns] = useState(INITIAL_COLUMNS);
            const [rows, setRows] = useState(INITIAL_FILE_DATA);

            const getFullUrl = (file) => {
                if (!file) return '';
                const filename = typeof file === 'string' ? file : file.filename;
                const folder = typeof file === 'object' ? file.folder : '';
                
                const name = (filename || '').trim();
                if (!name) return '';
                
                let base = githubBaseUrl.trim();
                if (!base.endsWith('/')) base += '/';
                
                const folderPath = folder && folder.trim() ? `${encodeURIComponent(folder.trim())}/` : '';
                let namePath = name;
                if (!namePath.includes('.')) {
                    namePath += '.html';
                }
                namePath = encodeURIComponent(namePath);
                
                return `${base}${folderPath}${namePath}`;
            };

            useEffect(() => {
                const rootHtml = document.documentElement;
                if (fontSize === 'normal') rootHtml.style.fontSize = '16px';
                else if (fontSize === 'large') rootHtml.style.fontSize = '19px';
                else if (fontSize === 'xlarge') rootHtml.style.fontSize = '22px';
                localStorage.setItem('claim_font_size', fontSize);
            }, [fontSize]);

            const triggerNotification = (message, type = 'success') => {
                setNotification({ show: true, message, type });
                setTimeout(() => setNotification(prev => ({ ...prev, show: false })), 3000);
            };

            const menuSuggestions = useMemo(() => {
                if (!searchTerm.trim()) return rows;
                const term = searchTerm.toLowerCase();
                return rows.filter(row => 
                    (row.filename || '').toLowerCase().includes(term) ||
                    (row.folder || '').toLowerCase().includes(term)
                );
            }, [searchTerm, rows]);

            const showSuggestionsDropdown = useMemo(() => {
                if (isInputHovered) return true;
                if (!searchTerm.trim()) return false;
                if (selectedFile && selectedFile.filename === searchTerm) return false;
                return true;
            }, [isInputHovered, searchTerm, selectedFile]);

            const handleSearchChange = (value) => {
                setSearchTerm(value);
                if (selectedFile && selectedFile.filename !== value) {
                    setSelectedFile(null);
                }
            };

            const handleSelectFile = (file) => {
                setSelectedFile(file);
                setSearchTerm(file.filename);
                setIsInputHovered(false);
                triggerNotification(`已選取檔案：「${file.filename}」(${file.folder || '未歸類'})`);
            };

            const handleCopyLink = () => {
                if (!selectedFile) return;
                const url = getFullUrl(selectedFile);
                
                const textArea = document.createElement("textarea");
                textArea.value = url;
                textArea.style.position = "fixed";
                textArea.style.left = "-999999px";
                document.body.appendChild(textArea);
                textArea.focus();
                textArea.select();
                
                try {
                    if (document.execCommand('copy')) {
                        triggerNotification(`📋 連結已成功複製！可直接傳給客戶。`, "success");
                    } else {
                        triggerNotification("複製失敗，請手動複製", "error");
                    }
                } catch (err) {
                    triggerNotification("無法複製連結，請重試", "error");
                }
                document.body.removeChild(textArea);
            };

            const handleAddFolder = () => {
                const name = prompt("請輸入新增資料夾名稱（例如：南山人壽資料）：");
                if (name && name.trim()) {
                    const clean = name.trim();
                    if (folders.includes(clean)) {
                        alert("該資料夾已存在！");
                        return;
                    }
                    setFolders([...folders, clean]);
                    triggerNotification(`已新增資料夾：「${clean}」`);
                }
            };

            const handleRenameFolder = (oldName) => {
                const newName = prompt(`請輸入資料夾「${oldName}」的新名稱：`, oldName);
                if (newName && newName.trim() && newName.trim() !== oldName) {
                    const clean = newName.trim();
                    setFolders(folders.map(f => f === oldName ? clean : f));
                    setRows(rows.map(r => r.folder === oldName ? { ...r, folder: clean } : r));
                    triggerNotification(`資料夾改名為：「${clean}」`);
                }
            };

            const handleDeleteFolder = (folderName) => {
                if (confirm(`確定要刪除資料夾「${folderName}」嗎？\n注意：原屬於該資料夾的檔案將會取消歸類。`)) {
                    setFolders(folders.filter(f => f !== folderName));
                    setRows(rows.map(r => r.folder === folderName ? { ...r, folder: '' } : r));
                    triggerNotification(`已刪除資料夾：「${folderName}」`, "warning");
                }
            };

            const handleGearClick = () => {
                const now = Date.now();
                if (lockoutUntil && now < lockoutUntil) {
                    setShowLockoutModal(true);
                    return;
                }
                
                if (showBackend) {
                    setShowBackend(false);
                    triggerNotification("已退出後台管理台", "success");
                } else {
                    setPasswordInput('');
                    setPasswordError('');
                    setShowPasswordModal(true);
                }
            };

            const handlePasswordSubmit = (e) => {
                e.preventDefault();
                if (passwordInput === "362963") {
                    setFailedAttempts(0);
                    setLockoutUntil(0);
                    localStorage.removeItem('claim_failed_attempts');
                    localStorage.removeItem('claim_lockout_until');
                    setShowPasswordModal(false);
                    setShowBackend(true);
                    triggerNotification("成功進入後台管理台！", "success");
                } else {
                    const newAttempts = failedAttempts + 1;
                    setFailedAttempts(newAttempts);
                    localStorage.setItem('claim_failed_attempts', String(newAttempts));

                    if (newAttempts >= 3) {
                        const lockTime = Date.now() + 12 * 60 * 60 * 1000;
                        setLockoutUntil(lockTime);
                        localStorage.setItem('claim_lockout_until', String(lockTime));
                        setShowPasswordModal(false);
                        setShowLockoutModal(true);
                        triggerNotification("錯誤達 3 次！系統已鎖定 12 小時", "error");
                    } else {
                        setPasswordError(`密碼不正確，剩餘 ${3 - newAttempts} 次機會。`);
                    }
                }
            };

            const addRow = () => {
                const defaultFolder = folders.length > 0 ? folders[0] : '';
                const today = new Date();
                const todayStr = `${today.getFullYear()}/${today.getMonth() + 1}/${today.getDate()}`;
                
                const newRow = { 
                    id: `row-${Date.now()}`,
                    folder: defaultFolder,
                    filename: '',
                    date: todayStr

                                                                    />
                                                                </td>

                                                                <td className="px-3 py-2 text-slate-500 group-hover:text-black whitespace-normal break-words">{row.date}</td>

                                                                <td className="px-3 py-2 font-mono text-[11px] text-blue-600 group-hover:text-black whitespace-normal break-all">
                                                                    <a href={fullUrl} target="_blank" rel="noopener noreferrer" className="hover:underline block w-full break-all whitespace-normal leading-relaxed">
                                                                        {fullUrl}
                                                                    </a>
                                                                </td>

                                                                <td className="px-2 py-2 text-center">
                                                                    <button
                                                                        onClick={() => deleteRow(row.id)}
                                                                        className="btn-hover-effect p-1 text-slate-400 hover:text-rose-600 group-hover:text-black rounded-lg"
                                                                        title="刪除此筆記錄"
                                                                    >
                                                                        <Icon name="trash-2" className="w-4 h-4 mx-auto" />
                                                                    </button>
                                                                </td>
                                                            </tr>
                                                        );
                                                    })}
                                                </tbody>
                                            </table>
                                        </div>
                                    </div>
                                </div>

                            </div>
                        )}

                    </main>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    
    </script>
</body>
</html>
